<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title">
  <title id="title">icmpchat: a terminal running icmpchat --peer 127.0.0.1 --name alice, which prints that alice is chatting with payload encryption off, sends "hi there" and gets a check mark when the echo reply arrives.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 21px; }
    .name { font-size: 50px; font-weight: 700; fill: #e6edf3; }
    .sub { fill: #8b949e; }
    .prompt { fill: #7ee787; }
    .cmd { fill: #e6edf3; }
    .answer { fill: #ffa657; }
    .cursor { fill: #7ee787; animation: blink 1.2s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect x="1" y="1" width="898" height="248" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text class="name" x="36" y="64">icmpchat</text>
  <text class="sub" x="306" y="62">chat inside ICMP echo requests</text>
  <text x="36" y="106"><tspan class="prompt">$ </tspan><tspan class="cmd">icmpchat --peer 127.0.0.1 --name alice 2&gt;/dev/null</tspan></text>
  <text class="answer" x="36" y="136">icmpchat: chatting as "alice", peer 127.0.0.1</text>
  <text class="answer" x="36" y="162">payload encryption: off</text>
  <text x="36" y="188"><tspan class="prompt">&gt; </tspan><tspan class="cmd">hi there</tspan></text>
  <text class="answer" x="36" y="214">✓</text>
  <rect class="cursor" x="36" y="222" width="12" height="20"/>
</svg>
